[project]
name = "structuresynth-mcp"
version = "0.3.0"
description = "MCP server for Structure Synth: render EisenScript grammars to 3D meshes (OBJ) headlessly."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Astrid3333" }]
requires-python = ">=3.10"
keywords = ["mcp", "structure-synth", "eisenscript", "procedural", "3d", "generative"]
dependencies = ["mcp>=2.0"]

[project.optional-dependencies]
export = [
    "matplotlib>=3.10.9",
    "pillow>=12.3.0",
    "trimesh>=4.0",
]

[project.scripts]
structuresynth-mcp = "structuresynth_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Astrid3333/structuresynth-mcp"
Repository = "https://github.com/Astrid3333/structuresynth-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/structuresynth_mcp"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "trimesh>=4.0", "matplotlib>=3.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
